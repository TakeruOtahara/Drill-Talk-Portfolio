# v3-app/docker-compose.yml
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      # 🛡️ BFF(proxy.ts)が内部バックエンドと安全に通信するための合言葉
      - DRILLTALK_API_KEY=${DRILLTALK_API_KEY}
      # 📡 BFF(proxy.ts)がリクエストを横流しする宛先（ローカル環境のコンテナ間通信）
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend