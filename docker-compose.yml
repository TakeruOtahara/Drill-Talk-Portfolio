# v3-app/docker-compose.yml
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      # 🛡️ BFF(middleware.ts)がAPIM/バックエンドの城壁を通るための合言葉
      - DRILLTALK_API_KEY=${DRILLTALK_API_KEY}
      # 📡 BFF(middleware.ts)がリクエストを横流しする本当の宛先
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend