name: Deploy Drill-Talk to Azure

on:
  push:
    branches: [ "master" ] # mainブランチにコードが送られたら起動

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # 1. コードの取得
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Azure へのログイン
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. ACR (コンテナ倉庫) へのログイン
      - name: Login to ACR
        run: |
          az acr login --name crdrilltalkprod${{ secrets.UNIQUE_SUFFIX }}

      # 4. Backend (FastAPI) のビルドとプッシュ
      - name: Build and push Backend
        run: |
          # タグに "latest" も追加しておくと管理が楽になります
          docker build ./backend -t crdrilltalkprod${{ secrets.UNIQUE_SUFFIX }}.azurecr.io/backend:${{ github.sha }}
          docker push crdrilltalkprod${{ secrets.UNIQUE_SUFFIX }}.azurecr.io/backend:${{ github.sha }}

      # 5. Frontend (Next.js) のビルドとプッシュ
      - name: Build and push Frontend
        run: |
          docker build ./frontend -t crdrilltalkprod${{ secrets.UNIQUE_SUFFIX }}.azurecr.io/frontend:${{ github.sha }}
          docker push crdrilltalkprod${{ secrets.UNIQUE_SUFFIX }}.azurecr.io/frontend:${{ github.sha }}

      # 6. Azure Container Apps の中身を更新
      - name: Update Container Apps
        run: |
          # ★修正ポイント：resource-group を "rg-drilltalk-v3.2" に変更
          az containerapp update \
            --name aca-drilltalk-prod-backend \
            --resource-group rg-drilltalk-v3.2 \
            --image crdrilltalkprod${{ secrets.UNIQUE_SUFFIX }}.azurecr.io/backend:${{ github.sha }}
          
          az containerapp update \
            --name aca-drilltalk-prod-frontend \
            --resource-group rg-drilltalk-v3.2 \
            --image crdrilltalkprod${{ secrets.UNIQUE_SUFFIX }}.azurecr.io/frontend:${{ github.sha }}

      # 7. ACRの古いイメージを削除（最新2つを残す）
      - name: Purge old ACR images
        run: |
          ACR_NAME="crdrilltalkprod${{ secrets.UNIQUE_SUFFIX }}"
          for REPO in "backend" "frontend"; do
            # 最新の2つを除外した古いタグ一覧を取得
            TAGS_TO_DELETE=$(az acr repository show-tags --name $ACR_NAME --repository $REPO --orderby time_desc --output tsv | tail -n +3)
            
            if [ -n "$TAGS_TO_DELETE" ]; then
              for TAG in $TAGS_TO_DELETE; do
                echo "Deleting $REPO:$TAG..."
                az acr repository delete --name $ACR_NAME --image $REPO:$TAG --yes
              done
            else
              echo "No old images to delete for $REPO."
            fi
          done